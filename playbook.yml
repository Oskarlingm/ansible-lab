---
- name: Administrar dos servidores Ubuntu con Ansible
  hosts: docker
  gather_facts: true

  tasks:
    - name: Mostrar el nombre del servidor
      ansible.builtin.debug:
        msg: "Nombre del servidor: {{ inventory_hostname }} (hostname: {{ ansible_hostname }})"

    - name: Mostrar el sistema operativo
      ansible.builtin.debug:
        msg: "Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: Crear el directorio principal de la practica
      ansible.builtin.file:
        path: /tmp/ansible-demo
        state: directory
        mode: '0755'

    - name: Crear el archivo info.txt con los datos del servidor
      ansible.builtin.copy:
        dest: /tmp/ansible-demo/info.txt
        content: |
          Nombre del servidor: {{ inventory_hostname }}
          Sistema operativo: {{ ansible_distribution }} {{ ansible_distribution_version }}
        mode: '0644'

    - name: Crear directorios con un loop
      ansible.builtin.file:
        path: "/tmp/ansible-demo/{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - logs
        - backup
        - config

    - name: Mostrar mensaje solo si el sistema operativo es Ubuntu
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} utiliza Ubuntu. Configuracion completada."
      when: ansible_distribution == 'Ubuntu'
